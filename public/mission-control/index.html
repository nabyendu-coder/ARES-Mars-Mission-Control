<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARES: Mars Mission Control</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="stage"></div>

<header id="top">
  <div class="brand"><b>ARES</b><span>Mars Mission Control</span></div>
  <nav id="nav" aria-label="Modules"></nav>
  <nav class="view-switch" aria-label="View mode">
    <span class="view-switch-current" aria-current="page">3D Terrain</span>
    <a class="view-switch-link" href="../?view=map" target="_top">2D Explorer</a>
  </nav>
  <button class="btn ghost" data-act="guide">Mission guide</button>
</header>

<div id="mission-stamp" aria-hidden="true">
  <p class="eyebrow">Active study region</p>
  <strong>JEZERO CRATER · MARS</strong>
  <span>HIRISE TERRAIN MODEL / ~10 M WEB GRID</span>
</div>
<div id="map-tools" aria-label="Map controls">
  <button class="tool-btn" data-act="recenter" title="Return to terrain overview"><span class="sym">◎</span>Recenter</button>
  <button class="tool-btn" data-act="go" data-m="explore" title="Open surface layer controls"><span class="sym">▧</span>Layers</button>
  <button class="tool-btn" data-act="panel" title="Show or hide the instrument panel"><span class="sym">⌁</span>Panel</button>
</div>
<aside id="panel" class="rise" aria-live="polite"></aside>
<div id="hud" aria-live="off"></div>
<div id="toast" role="status"></div>
<div id="tour" hidden></div>
<div id="modal" hidden></div>

<div id="intro">
  <div class="intro-in">
    <p class="eyebrow">NASA Space Apps Challenge 2026</p>
    <h1>ARES</h1>
    <p class="sub">Mars Mission Control<br>A walkable terrain study of Jezero Crater</p>
    <button id="enter" class="btn pri big">Enter mission control</button>
    <p id="status" class="note">Decoding terrain…</p>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/CSS2DRenderer.js"></script>
<script src="data/ares-data.js"></script>
<script src="js/model.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
